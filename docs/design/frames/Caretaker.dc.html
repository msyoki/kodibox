<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water readings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D45}a:hover{color:#08332D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F6F5F1; font-family: Manrope, system-ui, sans-serif; color: #14201E; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 13px; color: #5A635F">Mvule Apartments · November</p>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Water readings</h1>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><strong>18 of 24 units done</strong><span style="color: #5A635F">Due by 28 Nov</span></div>
<div style="height: 8px; background: #E2E0D8; border-radius: 99px; overflow: hidden"><div style="width: 75%; height: 100%; background: #0E4D45; border-radius: 99px"></div></div>
</div>

<div role="status" style="display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #E3ECF9; color: #1D4F91; font-size: 13px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4F91" stroke-width="2" aria-hidden="true"><path d="M2 8.5a15 15 0 0120 0"></path><path d="M5.5 12a10 10 0 0113 0"></path><path d="M9 15.5a5 5 0 016 0"></path><path d="M3 3l18 18"></path></svg>
Offline · 3 readings saved on this phone, will sync automatically
</div>

<section aria-labelledby="cur" style="background: #FFFFFF; border: 2px solid #0E4D45; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="cur" style="margin: 0; font-size: 18px; font-weight: 800">Unit M-07</h2>
<span style="font-size: 13px; color: #5A635F">Meter WM-20417</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5A635F">
Last reading (Oct)
<span style="min-height: 52px; display: flex; align-items: center; padding: 0 12px; border-radius: 12px; background: #F2F1EC; color: #14201E; font-family: 'IBM Plex Mono', monospace; font-size: 20px">1,284</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">
New reading
<input type="text" inputmode="numeric" value="1,297" style="min-height: 52px; padding: 0 12px; border: 2px solid #0E4D45; border-radius: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 20px; background: #FFFFFF; box-sizing: border-box; width: 100%">
</label>
</div>
<div style="display: flex; justify-content: space-between; padding: 12px; border-radius: 12px; background: #FAF9F6; border: 1px solid #EEECE5; font-size: 14px">
<span>13 units × KES 150</span><strong style="font-family: 'IBM Plex Mono', monospace">KES 1,950</strong>
</div>
<button type="button" style="min-height: 48px; border-radius: 12px; border: 1px dashed #0E4D45; background: #F1F7F5; color: #0E4D45; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E4D45" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Add meter photo (required)
</button>
<button type="button" style="min-height: 52px; border-radius: 12px; border: 0; background: #0E4D45; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800">Save &amp; next unit</button>
</section>

<section aria-labelledby="up" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="up" style="margin: 0; font-size: 14px; font-weight: 700; color: #5A635F">Up next</h2>
<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 1px solid #E2E0D8; border-radius: 12px; padding: 12px 14px; font-size: 14px">
<strong>{{u.unit}}</strong><span style="color: #5A635F; font-size: 13px">{{u.note}}</span>
</div>
</sc-for>
</section>
<nav aria-label="Tabs" style="margin: auto -16px -20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E0D8; padding: 6px 8px 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tab = (label, href, active) => ({ label, href, style: 'display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: ' + (active ? '800; color: #0E4D45; background: #E2EEEB' : '600; color: #5A635F') });
return {
units: [
{ unit: 'M-08', note: 'Last: 2,031' },
{ unit: 'M-09', note: 'Vacant · read anyway' }
],
tabs: [tab('Tasks', 'CaretakerHome.dc.html'), tab('Readings', 'Caretaker.dc.html', true), tab('Cash', 'CaretakerCash.dc.html'), tab('Jobs', 'CaretakerJob.dc.html')]
};
}
}
</script>
</body>
</html>
