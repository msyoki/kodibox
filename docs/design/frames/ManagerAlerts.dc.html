<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D45}a:hover{color:#08332D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F6F5F1; font-family: Manrope, system-ui, sans-serif; color: #14201E; display: flex; flex-direction: column">

<div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 10px">
<header style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Alerts</h1>
<button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #0E4D45; font: inherit; font-size: 13px; font-weight: 700">Mark all read</button>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="6">
<a href="{{a.href}}" style="{{a.card}}">
<span style="{{a.markStyle}}" aria-hidden="true">{{a.mark}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
<strong style="font-size: 14px">{{a.title}}</strong>
<span style="color: #5A635F">{{a.body}}</span>
</span>
<span style="flex: none; font-size: 12px; color: #5A635F">{{a.time}}</span>
</a>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; color: #5A635F; text-align: center">Push notifications never show tenant names or amounts on the lock screen.</p>
</div>

<nav aria-label="Tabs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E0D8; padding: 6px 8px 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tab = (label, href, active) => ({ label, href, style: 'display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: ' + (active ? '800; color: #0E4D45; background: #E2EEEB' : '600; color: #5A635F') });
const mk = (bg, fg) => 'flex: none; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: ' + bg + '; color: ' + fg;
const card = (unread, border) => 'display: flex; gap: 10px; align-items: flex-start; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: #14201E; background: ' + (unread ? '#FFFFFF' : '#FAF9F6') + '; border: 1px solid ' + (border || '#E2E0D8');
const ok = mk('#E1F2E8', '#1C6B44'), bad = mk('#FBE7E1', '#9B2C1A'), warn = mk('#FDEBD3', '#8A4B08'), info = mk('#E3ECF9', '#1D4F91');
return {
alerts: [
{ href: '#', mark: 'Pay', markStyle: ok, card: card(true), title: 'Payment received', body: 'KES 14,000 · A-03 · TK2F9RT4KD', time: '9:12' },
{ href: '#', mark: 'Pay', markStyle: ok, card: card(true), title: 'Payment received', body: 'KES 9,500 · A-11 · TK3H7LP1QW', time: '8:40' },
{ href: '#', mark: 'Sms', markStyle: bad, card: card(true), title: 'SMS failed to send', body: '3 reminders for Mvule Apartments not delivered', time: 'Yesterday' },
{ href: '#', mark: 'Ls', markStyle: warn, card: card(false), title: 'Lease ending in 30 days', body: 'C-03 · Rose Otieno · ends 2 Dec', time: 'Sat' },
{ href: '#', mark: 'Tax', markStyle: warn, card: card(false), title: 'MRI tax due 20 Nov', body: 'October gross rent KES 1,935,500 ready to review', time: 'Fri' },
{ href: '#', mark: 'Sec', markStyle: bad, card: card(true, '#9B2C1A'), title: 'Security alert: new sign-in', body: 'Chrome on Windows, Nairobi. Not you? Sign out all devices.', time: 'Thu' }
],
tabs: [tab('Home', 'ManagerHome.dc.html'), tab('Approvals', 'ManagerApprovals.dc.html'), tab('Tenants', 'ManagerTenant.dc.html'), tab('Alerts', 'ManagerAlerts.dc.html', true)]
};
}
}
</script>
</body>
</html>
