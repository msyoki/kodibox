<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager tenants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D45}a:hover{color:#08332D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F6F5F1; font-family: Manrope, system-ui, sans-serif; color: #14201E; display: flex; flex-direction: column">

<div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Tenants</h1>

<label style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border: 1px solid #E2E0D8; border-radius: 12px; background: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A635F" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="text" aria-label="Search tenants" value="Otieno" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 15px; background: transparent; color: #14201E">
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{tenants}}" as="t" hint-placeholder-count="3">
<a href="#" style="{{t.style}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px; font-size: 14px"><strong>{{t.name}}</strong><span style="font-size: 12px; color: #5A635F">{{t.unit}}</span></span>
<span style="{{t.balStyle}}">{{t.balance}}</span>
</a>
</sc-for>
</div>

<section aria-labelledby="qc" style="background: #FFFFFF; border: 2px solid #0E4D45; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div>
<h2 id="qc" style="margin: 0; font-size: 18px; font-weight: 800">Peter Otieno</h2>
<span style="font-size: 13px; color: #5A635F">B-12 · Riverside Court · 0712 ••• 512</span>
</div>
<span style="padding: 3px 10px; border-radius: 99px; background: #FDEBD3; color: #8A4B08; font-size: 12px; font-weight: 700">Due 5 Nov</span>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="padding: 10px 12px; border-radius: 12px; background: #FBE7E1"><span style="font-size: 12px; color: #9B2C1A">Balance</span><br><strong style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: #9B2C1A">KES 16,700</strong></div>
<div style="padding: 10px 12px; border-radius: 12px; background: #FAF9F6; border: 1px solid #EEECE5"><span style="font-size: 12px; color: #5A635F">Last payment</span><br><strong style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500">15,300</strong><span style="display: block; font-size: 11px; color: #5A635F">3 Oct · TJ9K2LQ7XA</span></div>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 1px solid #0E4D45; background: #FFFFFF; color: #0E4D45; text-decoration: none; font-size: 14px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E4D45" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"></path></svg>
Call</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 1px solid #0E4D45; background: #FFFFFF; color: #0E4D45; text-decoration: none; font-size: 14px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E4D45" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
SMS</a>
</div>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #0E4D45; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 800">Send STK request for KES 16,700</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 700">View statement</a>
</section>
</div>

<nav aria-label="Tabs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E0D8; padding: 6px 8px 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tab = (label, href, active) => ({ label, href, style: 'display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: ' + (active ? '800; color: #0E4D45; background: #E2EEEB' : '600; color: #5A635F') });
const row = (name, unit, balance, state, sel) => ({
name, unit, balance,
style: 'display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 14px; box-sizing: border-box; border-radius: 12px; text-decoration: none; color: #14201E; background: ' + (sel ? '#F1F7F5' : '#FFFFFF') + '; border: 1px solid ' + (sel ? '#0E4D45' : '#E2E0D8'),
balStyle: 'font-family: IBM Plex Mono, monospace; font-size: 14px; font-weight: 500; color: ' + (state === 'owing' ? '#9B2C1A' : '#1C6B44')
});
return {
tenants: [
{ ...row('Peter Otieno', 'B-12 · Riverside Court', '16,700', 'owing', true) },
{ ...row('Rose Otieno', 'C-03 · Baraka Flats', '0', 'paid', false) },
{ ...row('James Otienoh', 'M-09 · Mvule Apartments', '4,500', 'owing', false) }
],
tabs: [tab('Home', 'ManagerHome.dc.html'), tab('Approvals', 'ManagerApprovals.dc.html'), tab('Tenants', 'ManagerTenant.dc.html', true), tab('Alerts', 'ManagerAlerts.dc.html')]
};
}
}
</script>
</body>
</html>
