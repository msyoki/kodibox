<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How to pay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D45}a:hover{color:#08332D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F6F5F1; font-family: Manrope, system-ui, sans-serif; color: #14201E; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; gap: 12px">
<a href="TenantHome.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E0D8; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14201E" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 800">How to pay</h1>
</header>

<div style="background: #0E4D45; color: #FFFFFF; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #CFE3DE">Amount due by 5 November</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500; letter-spacing: -1px">KES 16,700</span>
</div>

<section aria-labelledby="pay-to" style="background: #FFFFFF; border: 1px solid #E2E0D8; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
<h2 id="pay-to" style="margin: 12px 0 4px; font-size: 14px; font-weight: 800">Pay your landlord’s paybill</h2>
<sc-for list="{{details}}" as="d" hint-placeholder-count="3">
<div style="{{d.style}}">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; color: #5A635F">{{d.label}}</span><strong style="{{d.vstyle}}">{{d.value}}</strong><span style="font-size: 12px; color: #5A635F">{{d.hint}}</span></span>
<button type="button" aria-label="{{d.aria}}" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #0E4D45; background: #FFFFFF; color: #0E4D45; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Copy</button>
</div>
</sc-for>
</section>

<section aria-labelledby="steps" style="background: #FFFFFF; border: 1px solid #E2E0D8; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<h2 id="steps" style="margin: 0; font-size: 14px; font-weight: 800">M-Pesa steps</h2>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li>{{s}}</li>
</sc-for>
</ol>
</section>

<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5A635F; text-align: center">Your money goes directly to your landlord. Kodibox never holds it.</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="TenantPaid.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #0E4D45; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">I’ve paid</a>
<a href="TenantReceipt.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 700">View my last receipt</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const row = (label, value, hint, mono, last) => ({
label, value, hint, aria: 'Copy ' + label.toLowerCase(),
style: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0' + (last ? '' : '; border-bottom: 1px solid #EEECE5'),
vstyle: 'font-size: 18px; font-weight: 700' + (mono ? "; font-family: 'IBM Plex Mono', monospace" : '')
});
return {
details: [
row('Paybill number', '000111', 'Mwangi Properties', true),
row('Account number', 'B-12', 'Type it exactly as shown, including the hyphen', true),
row('Bank transfer', 'Equity · account ending 4821', 'Account name: Mwangi Properties', true, true)
],
steps: [
'Go to M-Pesa, then Lipa na M-Pesa, then Pay Bill.',
'Business number: 000111.',
'Account number: B-12.',
'Enter the amount and your M-Pesa PIN. You get an M-Pesa confirmation SMS.'
]
};
}
}
</script>
</body>
</html>
