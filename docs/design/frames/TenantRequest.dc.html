<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D45}a:hover{color:#08332D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F6F5F1; font-family: Manrope, system-ui, sans-serif; color: #14201E; display: flex; flex-direction: column">

<div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<header style="display: flex; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #5A635F">B-12 · Riverside Court</p>
<h1 style="margin: 2px 0 0; font-size: 22px; font-weight: 800">Requests</h1>
</div>
<button type="button" onClick="{{openForm}}" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #0E4D45; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">New request</button>
</header>

<section aria-label="My requests" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{requests}}" as="r" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E2E0D8; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
<strong style="font-size: 15px">{{r.title}}</strong>
<span style="{{r.chip}}">{{r.status}}</span>
</div>
<p style="margin: 0; font-size: 13px; color: #5A635F">{{r.note}}</p>
<p style="margin: 0; font-size: 12px; color: #5A635F; font-family: 'IBM Plex Mono', monospace">{{r.meta}}</p>
</article>
</sc-for>
</section>
</sc-if>

<sc-if value="{{showForm}}" hint-placeholder-val="{{ false }}">
<header style="display: flex; align-items: center; gap: 12px">
<button type="button" onClick="{{closeForm}}" aria-label="Back to my requests" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E0D8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14201E" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<h1 style="margin: 0; font-size: 20px; font-weight: 800">New request</h1>
</header>

<div style="display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div role="group" aria-labelledby="cat" style="display: flex; flex-direction: column; gap: 8px">
<span id="cat" style="font-size: 14px; font-weight: 700">What is it about?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700">
Describe the problem
<textarea rows="3" style="padding: 12px 14px; border: 1px solid #C9C6BB; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 500; background: #FFFFFF; resize: none">Water keeps dripping under the kitchen sink since Sunday.</textarea>
</label>

<div role="group" aria-labelledby="ph" style="display: flex; flex-direction: column; gap: 8px">
<span id="ph" style="font-size: 14px; font-weight: 700">Photos <span style="font-weight: 500; color: #5A635F">(optional)</span></span>
<div style="display: flex; gap: 8px">
<div style="width: 64px; height: 64px; border-radius: 12px; background: #E2EEEB; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0E4D45">Photo 1</div>
<div style="width: 64px; height: 64px; border-radius: 12px; background: #E2EEEB; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0E4D45">Photo 2</div>
<button type="button" aria-label="Add photo" style="width: 64px; height: 64px; border-radius: 12px; background: #FFFFFF; border: 1px dashed #8A918D; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E4D45" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>

<div role="group" aria-labelledby="vt" style="display: flex; flex-direction: column; gap: 8px">
<span id="vt" style="font-size: 14px; font-weight: 700">Preferred visit time</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{times}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div role="group" aria-labelledby="ug" style="display: flex; flex-direction: column; gap: 8px">
<span id="ug" style="font-size: 14px; font-weight: 700">Urgency</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{urgs}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="margin-top: auto; padding-bottom: 10px; display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{closeForm}}" style="min-height: 52px; border-radius: 14px; border: 0; background: #0E4D45; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Send request</button>
<p style="margin: 0; font-size: 12px; color: #5A635F; text-align: center">The caretaker is notified. For fire or danger, call your landlord’s emergency line.</p>
</div>
</sc-if>
</div>

<nav aria-label="Tabs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E0D8; padding: 6px 8px 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const form = !!s.form;
const cat = s.cat || 'Plumbing', tm = s.tm || 'Evening', ug = s.ug || 'Normal';
const tab = (label, href, active) => ({ label, href, style: 'display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: ' + (active ? '800; color: #0E4D45; background: #E2EEEB' : '600; color: #5A635F') });
const chips = (labels, cur, key) => labels.map(l => ({
label: l, pressed: cur === l ? 'true' : 'false',
pick: () => this.setState({ [key]: l }),
style: 'min-height: 44px; padding: 0 12px; border-radius: 99px; font: inherit; font-size: 13px; cursor: pointer; ' + (cur === l ? 'border: 1px solid #0E4D45; background: #E2EEEB; color: #0E4D45; font-weight: 700' : 'border: 1px solid #D9D6CC; background: #FFFFFF; color: #14201E; font-weight: 600')
}));
const chipBase = 'flex: none; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; ';
return {
showForm: form, showList: !form,
openForm: () => this.setState({ form: true }),
closeForm: () => this.setState({ form: false }),
requests: [
{ title: 'Kitchen sink leaking', status: 'Scheduled', chip: chipBase + 'background: #E3ECF9; color: #1D4F91', note: 'Plumber booked for Wed 4 Nov, 10:00. Please be home or leave a key with the caretaker.', meta: 'REQ-0412 · opened 29 Oct' },
{ title: 'Security light on landing', status: 'In progress', chip: chipBase + 'background: #FDEBD3; color: #8A4B08', note: 'Caretaker Otieno Ouma has ordered a new bulb.', meta: 'REQ-0398 · opened 24 Oct' },
{ title: 'Gate intercom not ringing', status: 'Resolved', chip: chipBase + 'background: #E1F2E8; color: #1C6B44', note: 'Fixed on 12 Oct. Tell us if it happens again.', meta: 'REQ-0361 · closed 12 Oct' }
],
cats: chips(['Plumbing', 'Electrical', 'Security', 'Other'], cat, 'cat'),
times: chips(['Morning', 'Evening', 'Weekend'], tm, 'tm'),
urgs: chips(['Normal', 'Soon', 'Urgent'], ug, 'ug'),
tabs: [tab('Home', 'TenantHome.dc.html'), tab('Payments', 'TenantStatement.dc.html'), tab('Requests', 'TenantRequest.dc.html', true), tab('Profile', 'TenantProfile.dc.html')]
};
}
}
</script>
</body>
</html>
